# 06:30 Berlin time safety net (charter section 8): if today's issue has no valid digest.json,
# publish the title + link fallback built from candidates.json, then rebuild the site.
#
# The job fails, so GitHub sends a notification, when
#   - there is no candidates.json at all (fetch failed): nothing can be published today;
#   - the fallback was needed two days in a row: the editor task is broken, not just late.
# An editor that finishes after this ran still wins: ingest.yml replaces a fallback with the
# edited issue and rebuilds the site.
name: fallback

on:
  schedule:
    - cron: "30 4 * * *" # 06:30 CEST (summer)
    - cron: "30 5 * * *" # 06:30 CET (winter)
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD, Berlin time); empty = today"
        required: false

permissions:
  contents: write
  actions: write

# Shared with ingest.yml: both commit data/ to main.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Actions cron is UTC only and Berlin moves between UTC+2 (CEST) and UTC+1 (CET): both
  # schedules fire every day, and only the one matching today's offset goes on.
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CEST: "30 4 * * *"
          CET: "30 5 * * *"
        run: |
          expected=$([ "$(TZ=Europe/Berlin date +%z)" = "+0200" ] && echo "$CEST" || echo "$CET")
          if [ -z "$SCHEDULE" ] || [ "$SCHEDULE" = "$expected" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  fallback:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Publish the fallback if needed
        id: degrade
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: |
          date=${ISSUE_DATE:-$(python -c "from daily.window import local_today; print(local_today())")}
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [ ! -f "data/$date/candidates.json" ]; then
            echo "::error::data/$date/candidates.json is missing: fetch failed, nothing to publish for $date"
            exit 1
          fi
          # No-op when a valid digest is already there; exits 1 when there is nothing to publish.
          python -m daily degrade --date "$date"
          python -m daily render --date "$date"
      - name: Commit and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.degrade.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/$DATE"
          git diff --cached --quiet && exit 0
          git commit -m "digest: fallback for $DATE"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          gh workflow run pages.yml --ref main
      - name: Alert on a second fallback in a row
        env:
          DATE: ${{ steps.degrade.outputs.date }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import date, timedelta
          from pathlib import Path

          day = date.fromisoformat(os.environ["DATE"])

          def mode(d):
              path = Path("data") / d.isoformat() / "digest.json"
              return json.loads(path.read_text())["mode"] if path.exists() else None

          if mode(day) == "fallback" and mode(day - timedelta(days=1)) == "fallback":
              print(f"::error::{day} and the day before have no edited issue: check the editor task")
              sys.exit(1)
          PY
