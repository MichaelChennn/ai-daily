# Builds the site (python -m daily build) from main and deploys it to GitHub Pages.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so fallback.yml and ingest.yml
# start this one with `gh workflow run pages.yml --ref main` after they commit (workflow_dispatch
# is the exception to that rule). Pushes to main by people (merged PRs) trigger it directly.
# It always deploys from main: the github-pages environment only accepts the default branch.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "data/*/digest.json"
      - "daily/**"
      - "sources.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: python -m daily build --out _site --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
