# Builds the site from main and deploys it to GitHub Pages. The Astro front end (web/) builds every
# page; its data and the RSS feed come from python -m daily export (npm's prebuild, run inside
# `uv run` so it finds the project environment), so the publish gate stays in Python.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so fallback.yml and ingest.yml
# start this one with `gh workflow run pages.yml --ref main` after they commit (workflow_dispatch
# is the exception to that rule). Pushes to main by people (merged PRs) trigger it directly.
# It always deploys from main: the github-pages environment only accepts the default branch.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "data/*/digest.json"
      - "daily/**"
      - "web/**"
      - "sources.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: uv run npm run build --prefix web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
