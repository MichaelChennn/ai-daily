# Brings digests the Claude editor pushes into main, then rebuilds the site.
#
# The scheduled editor runs in a Claude cloud session, which can only push to its own claude/
# branch. `daily ingest --ref` (daily/ingest.py) adopts every data/*/digest.json and digest.en.json
# the branch changed, with the run's trace, by the rules of daily.publish; nothing else on the branch
# reaches main. This workflow only fetches the branch and commits.
# Run it by hand with a branch name to pick up a branch whose push did not run this workflow
# (e.g. one created before this file existed on main).
name: ingest

on:
  push:
    branches: ["claude/**"]
    paths: ["data/*/digest.json", "data/*/digest.en.json"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to take digests from (e.g. claude/xyz)"
        required: true

permissions:
  contents: write
  actions: write

# Shared with fallback.yml: both commit data/ to main.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # A named ref: the publish action's own fetches overwrite FETCH_HEAD.
      - name: Fetch the branch
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: git fetch --no-tags origin "+refs/heads/$BRANCH:refs/ingest/branch"
      - name: Adopt the branch's digests, commit and rebuild the site
        uses: ./.github/actions/publish
        with:
          message: "digest: {dates} (from ${{ inputs.branch || github.ref_name }})"
          run: uv run python -m daily ingest --ref refs/ingest/branch
