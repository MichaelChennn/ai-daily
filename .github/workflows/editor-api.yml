# The API route (docs/adr/0001-two-editor-routes.md): edits today's issue with cloud model APIs,
# next to the Claude route, and commits each model's digest as data/YYYY-MM-DD/digest.api.<slug>.json
# (a beta on the site). `daily edit` runs every model; the one whose digest would become the main
# issue (daily.publish: Claude route > API route > fallback, the first API model in) also writes the
# English edition. `daily ingest --from-dir` then adopts the run on the latest main: a Claude edit
# that arrives later through ingest.yml still replaces it. Each model's trace
# (trace.api.<slug>.json: what it picked, what validate dropped, where it failed) is committed too,
# also for a model that failed.
#
# Configuration (Settings -> Secrets and variables -> Actions):
#   secrets    NVIDIA_API_KEY
#   variable   EDITOR_API_MODEL: provider:model, comma separated, in order of priority for the main
#              issue, e.g. nvidia:minimaxai/minimax-m3.1-flash
name: editor-api

on:
  schedule:
    - cron: "30 3 * * *" # 05:30 CEST (summer)
    - cron: "30 4 * * *" # 05:30 CET (winter)
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD, Berlin time); empty = today"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  due:
    uses: ./.github/workflows/due.yml
    with:
      at: "05:30"

  edit:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
      # One model failing does not stop the others; the job fails afterwards so GitHub notifies.
      - name: Edit with each model
        id: edit
        env:
          ISSUE_DATE: ${{ inputs.date }}
          EDITOR_API_MODEL: ${{ vars.EDITOR_API_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          date=${ISSUE_DATE:-$(uv run python -c "from daily.window import local_today; print(local_today())")}
          echo "date=$date" >> "$GITHUB_OUTPUT"
          failed=0
          uv run python -m daily edit --date "$date" --out "$RUNNER_TEMP/api" || failed=1
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.edit.outputs.date != ''
        with:
          name: api-digests
          path: ${{ runner.temp }}/api/
          if-no-files-found: ignore
    outputs:
      date: ${{ steps.edit.outputs.date }}
      failed: ${{ steps.edit.outputs.failed }}

  # Editing takes a while and runs unlocked; committing shares the publish lock with ingest.yml and
  # fallback.yml. ingest runs on the latest main each attempt: the Claude route may have been
  # ingested meanwhile.
  publish:
    needs: edit
    if: needs.edit.outputs.date != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        continue-on-error: true # no artifact when every model failed
        with:
          name: api-digests
          path: ${{ runner.temp }}/api
      - name: Commit and rebuild the site
        uses: ./.github/actions/publish
        with:
          message: "digest: {dates} (from the API route)"
          run: uv run python -m daily ingest --from-dir "$RUNNER_TEMP/api"
      - name: Fail if a model failed
        if: needs.edit.outputs.failed == '1'
        run: exit 1
