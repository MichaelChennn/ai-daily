# M1: run `daily fetch` every day and commit data/YYYY-MM-DD/candidates.json, so the 7-day
# coverage check has real data. Scheduled runs only fire on the default branch.
name: fetch

on:
  schedule:
    - cron: "30 21 * * *" # 05:30 Beijing time
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD, Beijing time); empty = today"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Fetch sources
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_DATE: ${{ inputs.date }}
        # Prints the written path on stdout; exits 1 (failing the job, which notifies) when no
        # source returned anything.
        run: |
          path=$(python -m daily fetch ${ISSUE_DATE:+--date "$ISSUE_DATE"})
          echo "date=$(basename "$(dirname "$path")")" >> "$GITHUB_OUTPUT"
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: candidates for ${{ steps.fetch.outputs.date }}"
          git push
