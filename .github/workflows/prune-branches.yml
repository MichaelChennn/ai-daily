# Deletes claude/ branches whose last commit is more than two days old.
#
# Each scheduled editor run pushes to a new claude/ branch, and ingest.yml takes the digests from
# it without a PR, so GitHub's "delete head branches" setting never removes it. The two-day margin
# keeps the branch of a session that is still running (it pushes digest.json, then
# digest.en.json) and leaves a day to re-run ingest by hand on a branch whose push it missed.
# Other branches (research/, feature branches) are left alone.
name: prune-branches

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete stale claude/ branches
        run: |
          git fetch --no-tags origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          cutoff=$(date -d '2 days ago' +%s)
          git for-each-ref --format='%(refname:lstrip=3) %(committerdate:unix)' refs/remotes/origin/claude/ |
            while read -r branch committed; do
              if [ "$committed" -lt "$cutoff" ]; then
                echo "deleting $branch"
                git push origin --delete "$branch"
              fi
            done
