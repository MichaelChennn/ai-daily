# After actions/checkout (a local action is only there once the repo is checked out): uv, Python
# 3.12 and the locked dependencies, for every workflow that runs `daily`.
name: setup
description: uv with Python 3.12 and the locked dependencies
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: "3.12"
        enable-cache: true
    - run: uv sync --locked
      shell: bash
