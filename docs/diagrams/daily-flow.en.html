<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily · How an issue is made</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <script>
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#E8EBE3; --card:#F5F7F2; --ink:#161A15; --ink-2:#333A31; --muted:#626A5E; --line:rgba(22,26,21,.10); --chip:#D9DED2; --shade:rgba(22,26,21,.13); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#16171A; --card:#202226; --ink:#EDEBE6; --ink-2:#C9C6BF; --muted:#8E8B85; --line:rgba(237,235,230,.12); --chip:#2E3035; --shade:rgba(0,0,0,.45); color-scheme: dark; } }
    :root[data-theme="dark"] { --paper:#16171A; --card:#202226; --ink:#EDEBE6; --ink-2:#C9C6BF; --muted:#8E8B85; --line:rgba(237,235,230,.12); --chip:#2E3035; --shade:rgba(0,0,0,.45); color-scheme: dark; }
    :root {
      --f-title: "Noto Serif SC", serif;
      --f-body: "Inter", "PingFang SC", "Noto Sans SC", sans-serif;
      --f-mono: "JetBrains Mono", "Noto Sans SC", monospace;
    }
    html, body { background: var(--paper); }
    body {
      font-family: var(--f-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .frame { max-width: 1352px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow-html {
      font-family: var(--f-mono);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h1 { font-family: var(--f-title); font-weight: 700; font-size: 28px; line-height: 1.3; margin-bottom: 12px; }
    .lede { font-size: 15px; line-height: 1.7; color: var(--ink-2); max-width: 720px; margin-bottom: 32px; }
    svg { width: 100%; min-width: 1352px; display: block; }
    svg .card { filter: drop-shadow(0 6px 8px var(--shade)); }
    svg .wire { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linejoin: round; }
    svg .name { font-family: var(--f-body); font-size: 13px; font-weight: 600; }
    svg .cli { font-family: var(--f-mono); font-size: 18px; font-weight: 600; }
    svg .mono { font-family: var(--f-mono); font-size: 11px; }
    svg .desc { font-family: var(--f-body); font-size: 12px; }
    svg .desc-strong { font-family: var(--f-body); font-size: 13px; font-weight: 500; }
    svg .on-ink { opacity: .78; }
    svg .head { font-family: var(--f-title); font-size: 15px; font-weight: 700; }
    svg .when { font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
    svg .eyebrow { font-family: var(--f-mono); font-size: 9px; font-weight: 500; letter-spacing: .14em; }
    svg .alabel { font-family: var(--f-body); font-size: 12px; font-weight: 500; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow-html">Process · ai-daily</p>
    <h1>AI Daily · How an issue is made</h1>
    <p class="lede">Candidates are fetched at 05:07, both routes start editing at 05:30, each pushed issue is ingested into main and the main one picked, the fallback goes out at 06:30 if none is valid, and every commit rebuilds the site.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 1352 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daily-flow-title daily-flow-desc">
        <title id="daily-flow-title">AI Daily · How an issue is made</title>
        <desc id="daily-flow-desc">At 05:07 fetch.yml fetches the sources, removes repeats and commits candidates.json. At 05:30 the Claude route scores and picks, reads the sources and writes the Chinese issue, self-checks and validates, writes the English issue and pushes to its claude/ branch; on the API route each model picks, writes and is validated until it passes, and the main issue's model writes the English one. ingest.yml rechecks and ingests each issue, picks the main by priority Claude, API, fallback and commits it to main. At 06:30 fallback.yml publishes the fallback if there is still no valid issue. pages.yml then exports the issues, builds the site and deploys it to GitHub Pages.</desc>

          <marker id="daily-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--muted)"/></marker>
        </defs>

<text x="40" y="62" class="when" style="fill:var(--muted)">05:07</text>

<text x="40" y="180" class="head" style="fill:var(--ink)">Claude route</text>
<text x="40" y="198" class="mono" style="fill:var(--muted)">daily-editor</text>
<line x1="40" y1="224" x2="1312" y2="224" style="stroke:var(--line);stroke-width:1"/>
<text x="40" y="254" class="when" style="fill:var(--muted)">05:30</text>
<text x="40" y="276" class="head" style="fill:var(--ink)">API route</text>
<text x="40" y="294" class="mono" style="fill:var(--muted)">editor-api.yml</text>
<line x1="40" y1="320" x2="1312" y2="320" style="stroke:var(--line);stroke-width:1"/>

<text x="40" y="390" class="mono" style="fill:var(--muted)">ingest.yml</text>

<text x="40" y="582" class="mono" style="fill:var(--muted)">pages.yml</text>
<line x1="40" y1="32" x2="1312" y2="32" style="stroke:var(--ink);stroke-width:2"/>
<line x1="40" y1="608" x2="1312" y2="608" style="stroke:var(--ink);stroke-width:2"/>

<path d="M400,108 L400,168 Q400,176 408,176 L494,176" class="wire" marker-end="url(#daily-flow-arrow)"/>
