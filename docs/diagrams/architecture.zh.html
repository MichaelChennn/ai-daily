<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 晨报 · 后端架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <script>
    const t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#E8EBE3; --card:#F5F7F2; --ink:#161A15; --ink-2:#333A31; --muted:#626A5E; --line:rgba(22,26,21,.10); --chip:#D9DED2; --shade:rgba(22,26,21,.13); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#16171A; --card:#202226; --ink:#EDEBE6; --ink-2:#C9C6BF; --muted:#8E8B85; --line:rgba(237,235,230,.12); --chip:#2E3035; --shade:rgba(0,0,0,.45); color-scheme: dark; } }
    :root[data-theme="dark"] { --paper:#16171A; --card:#202226; --ink:#EDEBE6; --ink-2:#C9C6BF; --muted:#8E8B85; --line:rgba(237,235,230,.12); --chip:#2E3035; --shade:rgba(0,0,0,.45); color-scheme: dark; }
    :root {
      --f-title: "Noto Serif SC", serif;
      --f-body: "Inter", "PingFang SC", "Noto Sans SC", sans-serif;
      --f-mono: "JetBrains Mono", "Noto Sans SC", monospace;
    }
    html, body { background: var(--paper); }
    body {
      font-family: var(--f-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow-html {
      font-family: var(--f-mono);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h1 { font-family: var(--f-title); font-weight: 700; font-size: 28px; line-height: 1.3; margin-bottom: 12px; }
    .lede { font-size: 15px; line-height: 1.7; color: var(--ink-2); max-width: 720px; margin-bottom: 32px; }
    svg { width: 100%; min-width: 1280px; display: block; }
    svg .card { filter: drop-shadow(0 6px 8px var(--shade)); }
    svg .wire { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linejoin: round; }
    svg .name { font-family: var(--f-body); font-size: 13px; font-weight: 600; }
    svg .cli { font-family: var(--f-mono); font-size: 18px; font-weight: 600; }
    svg .mono { font-family: var(--f-mono); font-size: 11px; }
    svg .desc { font-family: var(--f-body); font-size: 12px; }
    svg .desc-strong { font-family: var(--f-body); font-size: 13px; font-weight: 500; }
    svg .on-ink { opacity: .78; }
    svg .head { font-family: var(--f-title); font-size: 15px; font-weight: 700; }
    svg .when { font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
    svg .eyebrow { font-family: var(--f-mono); font-size: 9px; font-weight: 500; letter-spacing: .14em; }
    svg .alabel { font-family: var(--f-body); font-size: 12px; font-weight: 500; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

    <h1>AI 晨报 · 后端架构</h1>
